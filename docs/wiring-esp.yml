# WireViz harness for the REAL device (12 V plan, built with: pio run -e real): ESP32 with flow sensor, buttons, pot, OLED, LEDs.
# Render:  wireviz docs/wiring-esp.yml   -> wiring-esp.svg / .png / .bom.tsv  (delete the .html)
# Source of truth for pins is ../PINOUT.md and src/main.cpp.
# Connectors named "... (from wiring-xxx)" are stubs: the real block is drawn in that other file.
# Terminal strips are separate per net (TB_12V, TB_5V, TB_GND): all pins on one strip are joined.

metadata:
  title: Water dispenser — ESP32, sensor, controls, display
  pn: elefun/wiring-esp

templates:
  - &dupont
    type: Dupont jumper
    gauge: 0.25 mm2
    length: 0.2
  - &power
    type: Power wire, stranded
    gauge: 0.75 mm2
    length: 0.5
  - &signal
    type: Hookup wire, stranded
    gauge: 0.25 mm2
    length: 0.5

connectors:
  ESP32:
    type: ESP32 DevKit V1 (30-pin)
    subtype: from the owner
    pinlabels: [3V3, GND, D34, D26, D27, D25, D33, D21, D22, D13]
    notes: All GND pins are common

  "+5V (from wiring-power)":
    type: Terminal strip TB_5V
    pinlabels: ["+5V"]

  "GND (from wiring-power)":
    type: Terminal strip TB_GND
    pinlabels: [GND]

  FLOW:
    type: Flow sensor YF-S201 / YF-B5
    subtype: arrow = flow direction
    pinlabels: [Red 5V, Black GND, Yellow SIG]

  DIVIDER:
    type: Divider (strip + 2 resistors)
    subtype: R1 10k, R2 20k
    pinlabels: [5V, GND, SIG in (5 V), D27 out (3.3 V)]
    notes: 5 V in, 3.3 V out

  POT_VOLUME:
    type: Potentiometer 10 kΩ
    subtype: volume knob
    pinlabels: [VCC, SIG, GND]

  BTN_START:
    type: Momentary button, NO
    subtype: START
    pinlabels: [A, B]

  BTN_RESET:
    type: Momentary button, NO
    subtype: RESET
    pinlabels: [A, B]

  LED_VALVE:
    type: Red LED + 220 Ω
    subtype: valve open
    pinlabels: [Anode, Cathode]

  LED_FLOW:
    type: Green LED + 220 Ω
    subtype: water flowing
    pinlabels: [Anode, Cathode]

  OLED:
    type: SSD1306 0.96" I2C
    pinlabels: [VCC, GND, SDA, SCL]

cables:
  W_SENS_PWR:
    <<: *signal
    wirecount: 2
    colors: [RD, BK]
  W_FLOW:
    <<: *signal
    type: Sensor cable (3 wires, as supplied)
    wirecount: 3
    colors: [RD, BK, YE]
    length: 1.0
  W_SIG: {<<: *signal, wirecount: 1, colors: [YE]}
  W_POT:
    <<: *dupont
    wirecount: 3
    colors: [RD, GN, BK]
  W_BTN:
    <<: *dupont
    wirecount: 2
    colors: [BU, BK]
  W_RESET:
    <<: *dupont
    wirecount: 2
    colors: [RD, BK]
  W_VALVELED:
    <<: *dupont
    wirecount: 2
    colors: [RD, BK]
  W_FLOWLED:
    <<: *dupont
    wirecount: 2
    colors: [GN, BK]
  W_OLED:
    <<: *dupont
    wirecount: 4
    colors: [RD, BK, YE, VT]

connections:
  - - DIVIDER: [1, 2, 3]
    - W_FLOW: [1, 2, 3]
    - FLOW: [1, 2, 3]
  - - DIVIDER: [1]
    - W_SENS_PWR: [1]
    - "+5V (from wiring-power)": [1]
  - - DIVIDER: [2]
    - W_SENS_PWR: [2]
    - "GND (from wiring-power)": [1]
  - - DIVIDER: [4]
    - W_SIG: [1]
    - ESP32: [5]
  - - POT_VOLUME: [1, 2, 3]
    - W_POT: [1, 2, 3]
    - ESP32: [1, 3, 2]
  - - BTN_START: [1, 2]
    - W_BTN: [1, 2]
    - ESP32: [4, 2]
  - - BTN_RESET: [1, 2]
    - W_RESET: [1, 2]
    - ESP32: [10, 2]
  - - LED_VALVE: [1, 2]
    - W_VALVELED: [1, 2]
    - ESP32: [6, 2]
  - - LED_FLOW: [1, 2]
    - W_FLOWLED: [1, 2]
    - ESP32: [7, 2]
  - - OLED: [1, 2, 3, 4]
    - W_OLED: [1, 2, 3, 4]
    - ESP32: [1, 2, 8, 9]
