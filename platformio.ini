; Water dispenser — ESP32 DevKit V1 (30-pin, HW-394 clone)
;
;   pio run -e sim -t upload     ; home stub: built-in flow simulator
;   pio run -e real -t upload    ; real flow sensor on GPIO27
;   pio device monitor

[platformio]
default_envs = sim

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.30

[env:sim]
build_flags =
    -DSIMULATE_FLOW=1
    -DHAS_RATE_POT=0

[env:real]
build_flags =
    -DSIMULATE_FLOW=0
    -DHAS_RATE_POT=0
